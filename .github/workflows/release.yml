# Builds the plugin and publishes the three files BRAT and Obsidian's own
# installer look for. Triggered by pushing a version tag that matches the
# version in manifest.json, e.g. `git tag 0.2.0 && git push origin 0.2.0`.
#
# main.js is a build artifact and is not committed, so it is produced here
# and attached to the release rather than read out of the repository.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Verify the tag matches manifest.json
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$manifest_version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version}." >&2
            exit 1
          fi

      - run: npm test
      - run: npm run build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --generate-notes
